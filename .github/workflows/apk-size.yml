# APK Size：PR 時分別建置目標分支與 PR 的 APK，在 PR 留言比較大小
name: APK Size

on:
  pull_request:

concurrency:
  group: apk-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.38.x

jobs:
  build:
    strategy:
      matrix:
        include:
          - which: base
            ref: ${{ github.base_ref }}
          - which: pr
            ref: ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.which }}-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3

  compare:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: base-apk
          path: base

      - uses: actions/download-artifact@v7
        with:
          name: pr-apk
          path: pr

      - name: Comment size diff
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const base = fs.statSync('base/app-release.apk').size;
            const pr = fs.statSync('pr/app-release.apk').size;
            const diff = pr - base;
            const fmt = (b) => (b / 1024 / 1024).toFixed(2) + ' MB';
            const sign = diff > 0 ? '+' : '';
            const emoji = diff > 500000 ? '⚠️' : diff < -500000 ? '🎉' : '📦';

            const body = [
              `${emoji} **APK Size**`,
              '',
              '| | Size |',
              '|---|---|',
              `| ${context.payload.pull_request.base.ref} | ${fmt(base)} |`,
              `| PR | ${fmt(pr)} |`,
              `| diff | ${sign}${fmt(diff)} |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('**APK Size**'));

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
