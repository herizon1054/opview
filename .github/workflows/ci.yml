name: CI

on:
  push:
    branches: [opview-general]
  pull_request:
    branches: [opview-general]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.x   # pin: pubspec.lock needs >=3.38.4; newer Flutter breaks AGP 8.7 / Gradle 8.9
          cache: true

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      - run: flutter test --exclude-tags golden

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.x   # pin: pubspec.lock needs >=3.38.4; newer Flutter breaks AGP 8.7 / Gradle 8.9
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: opview-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.x   # pin: pubspec.lock needs >=3.38.4; newer Flutter breaks AGP 8.7 / Gradle 8.9
          cache: true

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign
