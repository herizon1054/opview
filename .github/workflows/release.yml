# Release：推送 v 開頭的標籤（scripts/release.sh 會自動建立）時，建置 APK 並建立 GitHub Release
#   main 分支的標籤：v0.1.2；其他分支：v0.1.2-<分支名>（例如 v0.1.2-stopcar），兩個分支同一個 repo 不會撞標籤
name: Release

on:
  push:
    tags: ['v*']

env:
  FLUTTER_VERSION: 3.38.x

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 設定固定簽章（有設定 secrets 才執行）
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: bash scripts/ci_signing.sh

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      - run: flutter test --exclude-tags golden

      - run: flutter build apk --release

      - name: Rename APK
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp build/app/outputs/flutter-apk/app-release.apk "opview-${version}.apk"

      - name: Generate changelog
        id: changelog
        run: |
          prev_tag=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || echo "")
          if [ -n "$prev_tag" ]; then
            log=$(git log --pretty=format:'- %s' "${prev_tag}..${GITHUB_REF_NAME}^")
          else
            log="- Initial release"
          fi
          if [ -f android/key.properties ]; then
            sign="固定金鑰簽章，可直接覆蓋安裝。"
          else
            sign="CI 臨時 debug 金鑰簽章（每次不同），安裝前請先移除舊版 opview。"
          fi
          {
            echo 'body<<EOF'
            echo "$log"
            echo ''
            echo "$sign"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.body }}

            ## Download

            - **opview-${{ github.ref_name }}.apk** — Universal Android APK (sideload)
          files: opview-*.apk
