# Screenshots：手動執行（Actions → Screenshots → Run workflow），
# 用 test/golden/screenshot_test.dart 產生各尺寸、各情境的截圖，上傳到這次執行的 Artifacts。
# 原版會在 main 推送時部署 GitHub Pages、PR 時留言；這兩個分支沒有 main，也不一定開 Pages，所以改成手動。
name: Screenshots

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.38.x

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: 和已提交的截圖比對（有差異不會失敗）
        run: flutter test test/golden/screenshot_test.dart --tags golden || echo "::warning::截圖與已提交的版本不同，請下載 screenshot-diffs 檢查"

      - name: 產生新截圖
        run: flutter test test/golden/screenshot_test.dart --update-goldens --tags golden

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: test/golden/goldens/
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: test/golden/goldens/failures/
          if-no-files-found: ignore
          retention-days: 30
