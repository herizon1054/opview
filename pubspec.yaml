name: opview
description: openpilot onroad UI over WebRTC
publish_to: 'none'
version: 2.0.6+206  # v2.0.6（Android versionName 2.0.6、versionCode 206；結尾為 .0 的版本會省略，見 android/app/build.gradle）

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.3.0
  bonsoir: ^6.0.2
  http: ^1.2.0
  connectivity_plus: ^7.0.0
  shared_preferences: ^2.3.0
  logger: ^2.6.2  # 接收 flutter_webrtc 原生 log（lib/services/webrtc_native_log.dart）

# opview patch：使用專案內修改過的 flutter_webrtc 1.3.0（停用 Android network monitor，
# 讓手機當熱點時 WebRTC 能使用熱點介面）。說明見 third_party/flutter_webrtc/OPVIEW_PATCH_zh-TW.md
dependency_overrides:
  flutter_webrtc:
    path: third_party/flutter_webrtc

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 起步提醒的嗶嗶聲（beep.wav）；Google 語音用手機的文字轉語音，不需要音檔
  assets:
    - assets/sounds/
